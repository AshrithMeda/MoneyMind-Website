<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Dashboard | MoneyQuest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>

  <main class="dashboard">
    <div class="container">
      <div class="dashboard-head">
        <div>
          <span class="pill">Staff dashboard</span>
          <h1>Workshop Manager</h1>
        </div>
        <button id="logout" class="btn secondary">Log out</button>
      </div>

      <div id="stats" class="statgrid"></div>

      <div class="dashboard-grid">
        <section class="card">
          <h2>Add Event</h2>
          <form id="event-form">
            <div class="row">
              <div class="field">
                <label>Title</label>
                <input id="title" required>
              </div>
              <div class="field">
                <label>Emoji</label>
                <input id="emoji" value="🌟">
              </div>
            </div>

            <div class="field">
              <label>Description</label>
              <textarea id="description" required></textarea>
            </div>

            <div class="row">
              <div class="field">
                <label>Date & time</label>
                <input id="date" type="datetime-local" required>
              </div>
              <div class="field">
                <label>Location</label>
                <input id="location" required>
              </div>
            </div>

            <div class="row">
              <div class="field">
                <label>Capacity</label>
                <input id="capacity" type="number" min="1" value="20" required>
              </div>
              <div class="field">
                <label>Financial concepts</label>
                <input id="concepts" value="Budgeting, Teamwork">
              </div>
            </div>

            <button class="btn primary" type="submit">Create Event</button>
            <p id="event-message"></p>
          </form>
        </section>

        <section class="card">
          <h2>Create Admin</h2>
          <form id="admin-form">
            <div class="field">
              <label>New admin username</label>
              <input id="new-admin-username" type="text" minlength="3" required>
            </div>
            <div class="field">
              <label>New admin password</label>
              <input id="new-admin-password" type="password" minlength="8" required>
            </div>
            <button class="btn secondary" type="submit">Create new admin login</button>
            <p id="admin-message"></p>
          </form>

          <div class="admin-list-block">
            <h3>Existing admin logins</h3>
            <div id="admin-list" class="admin-list"></div>
          </div>
        </section>

        <section class="card">
          <div class="section-head">
            <h2>Current Events</h2>
            <button id="refresh" class="btn secondary small">Refresh</button>
          </div>
          <div id="event-list">Loading…</div>
        </section>

        <section class="card admin-edit-card">
          <h2>Past Event Archive</h2>
          <p class="muted">Choose a past event to add photos, reflections, and follow-up notes.</p>
          <form id="event-editor-form">
            <div class="field">
              <label>Select past event</label>
              <select id="edit-event-id"></select>
            </div>
            <div class="field">
              <label>Updated title</label>
              <input id="edit-event-title" type="text">
            </div>
            <div class="field">
              <label>Event date</label>
              <input id="edit-event-date" type="datetime-local">
            </div>
            <div class="field">
              <label>Location</label>
              <input id="edit-event-location" type="text">
            </div>
            <div class="field">
              <label>Event summary</label>
              <textarea id="edit-event-description"></textarea>
            </div>
            <div class="field">
              <label>Photo URLs (one per line)</label>
              <textarea id="edit-event-photos" rows="4"></textarea>
            </div>
            <div class="field">
              <label>Reflection message</label>
              <textarea id="edit-event-reflection" rows="5"></textarea>
            </div>
            <div class="field">
              <label>Highlights / takeaways</label>
              <textarea id="edit-event-highlights" rows="4"></textarea>
            </div>
            <button class="btn primary" type="submit">Save archive details</button>
            <p id="archive-message"></p>
          </form>
        </section>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
