<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshops | MoneyQuest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>

  <main class="section event-hero">
    <div class="container">
      <div class="section-intro">
        <span class="pill">Upcoming workshops</span>
        <h1>Choose your next challenge.</h1>
        <p>Every event is a standalone 3-hour hands-on experience designed to turn real life money lessons into something students want to complete.</p>
      </div>

      <div class="event-tabs" role="tablist" aria-label="Event filters">
        <button class="event-tab is-active" type="button" data-event-tab="upcoming">Upcoming events</button>
        <button class="event-tab" type="button" data-event-tab="past">Past events</button>
      </div>

      <div id="events" class="event-list"></div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
